name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_MONGO_URI: mongodb://127.0.0.1:27017/syncdoc-test
      - run: npm run build
        env:
          JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          MONGO_URI: mongodb://127.0.0.1:27017/syncdoc
